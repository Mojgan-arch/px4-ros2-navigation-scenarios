# Interface profile: real PX4 airframe
#
# Copy this file, edit it for your vehicle, and pass it to any scenario:
#
#     ros2 launch waypoint_navigator waypoint.launch.py \
#         interface_config:=/path/to/my_vehicle.yaml
#
# Nothing in the navigation nodes changes. Read docs/hardware.md before the
# first flight — this file is the configuration half of that checklist, not
# the whole of it.

/**:
  ros__parameters:

    topics:
      # Unchanged from simulation: px4_offboard_interface_node runs on the
      # companion computer and speaks to the real autopilot over Micro
      # XRCE-DDS, exactly as it does to SITL.
      cmd_vel: /nav/cmd_vel
      arm: /nav/arm

      # Confirm these against `ros2 topic list` on the companion computer.
      # The versioned names arrived in PX4 v1.15.
      local_position: /fmu/out/vehicle_local_position_v1
      battery: /fmu/out/battery_status_v1

      # Your real LiDAR driver's output. Common examples:
      #   Livox            /livox/lidar
      #   Ouster           /ouster/points
      #   RealSense depth  /camera/depth/color/points
      pointcloud: /livox/lidar

      goal_pose: /goal_pose
      clicked_point: /clicked_point
      nav_state: /nav_state

    frames:
      # If an external SLAM package (FAST-LIO, RTAB-Map, …) provides the map
      # frame, set it to whatever that package publishes. If you are flying
      # on PX4's EKF alone, `odom` is usually the honest choice, since there
      # is no loop-closed map frame to speak of.
      map: map
      odom: odom
      base_link: base_link
